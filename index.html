<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brew Bar</title>
<meta name="theme-color" content="#2F4A45">
<meta name="description" content="Coffee recipes with live Bookoo Themis Ultra scale and shared settings.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <button class="home-link" id="go-home" aria-label="All brewers">Brew Bar</button>
  <div class="pills">
    <button class="pill" id="scale-btn"><span class="dot" id="scale-dot"></span><span id="scale-label">Connect scale</span></button>
    <button class="pill" id="sync-btn"><span class="dot" id="sync-dot"></span><span id="sync-label">Sync off</span></button>
  </div>
</header>
<main class="wrap" id="app"></main>

<dialog id="sync-dlg">
  <form method="dialog" class="dlg" id="sync-form">
    <h2>Sync settings</h2>
    <p class="muted">Recipes are saved to a private GitHub gist so every phone with Brew Bar sees the same settings.</p>
    <label class="label" for="sync-token">GitHub token (gist scope)</label>
    <input id="sync-token" type="password" autocomplete="off" placeholder="ghp_…">
    <p class="small">Classic token with only the <b>gist</b> box ticked: github.com → Settings → Developer settings → Personal access tokens → Tokens (classic). Leave blank on a phone that should only read.</p>
    <label class="label" for="sync-gist">Gist ID</label>
    <div class="row"><input id="sync-gist" autocomplete="off" placeholder="Created for you if blank"><button type="button" class="btn ghost" id="sync-copy">Copy</button></div>
    <p class="small" id="sync-msg" role="status"></p>
    <div class="row end">
      <button type="button" class="btn ghost" id="sync-off">Turn off</button>
      <button type="button" class="btn ghost" id="sync-cancel">Close</button>
      <button type="button" class="btn" id="sync-save">Save and sync</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
